<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Hotaru</title>
<style>
  :root {
    color-scheme: light;
    --panel: rgba(246, 246, 248, .84);
    --border: rgba(0, 0, 0, .18);
    --ink: #1d1d1f;
    --ink-2: rgba(0, 0, 0, .42);
    --grid: rgba(0, 0, 0, .08);
    --btn: rgba(120, 120, 128, .13);
    --chip: rgba(120, 120, 128, .14);
    --up: #38bdf8;
    --down: #34d399;
    --warn: #f87171;
    --amber: #fbbf24;
    --traffic: #a78bfa;
    --off: #9d9da1;
    --tooltip: rgba(239, 239, 242, .96);
    --tooltip-ink: #1d1d1f;
    --tooltip-border: rgba(0, 0, 0, .12);
    /* 浮层用不透明面:标签弹窗盖在节点列表上,不能透出下面的文字 */
    --pop: #ffffff;
  }
  :root[data-theme="dark"] {
      color-scheme: dark;
      --panel: rgba(38, 38, 40, .78);
      --border: rgba(255, 255, 255, .14);
      --ink: #f2f2f4;
      --ink-2: rgba(255, 255, 255, .58);
      --grid: rgba(255, 255, 255, .10);
      --btn: rgba(255, 255, 255, .10);
      --chip: rgba(255, 255, 255, .12);
      --pop: #2f2f31;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]):not([data-theme="dark"]) {
      color-scheme: dark;
      --panel: rgba(38, 38, 40, .78);
      --border: rgba(255, 255, 255, .14);
      --ink: #f2f2f4;
      --ink-2: rgba(255, 255, 255, .58);
      --grid: rgba(255, 255, 255, .10);
      --btn: rgba(255, 255, 255, .10);
      --chip: rgba(255, 255, 255, .12);
      --pop: #2f2f31;
    }
  }
  /* WebView2 does not provide the transparent native popover surface used by
     macOS. Paint the whole Windows window with an opaque theme surface, and let
     DWM round the window frame instead of the panel (see round_window_corners):
     a rounded panel here would only reveal the square window behind it. */
  :root.windows-opaque {
    --panel: #f6f6f8;
  }
  :root.windows-opaque[data-theme="dark"] {
    --panel: #262628;
  }
  @media (prefers-color-scheme: dark) {
    :root.windows-opaque:not([data-theme="light"]):not([data-theme="dark"]) {
      --panel: #262628;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
    font-size: 13px; color: var(--ink);
    -webkit-user-select: none; user-select: none;
    /* 跟随窗口宽度而不是写死 320:窗口若因跨屏 DPI 变化短暂不等于 320
       逻辑像素,布局会自适应,而不是被裁掉两边 */
    width: 100%; overflow: hidden;
  }
  #panel {
    width: 100%; height: 100%;
    background: var(--panel);
    backdrop-filter: blur(28px) saturate(1.6);
    -webkit-backdrop-filter: blur(28px) saturate(1.6);
    border: .5px solid var(--border);
    border-radius: 13px;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  /* macOS uses a native NSVisualEffectView Popover material. Avoid stacking
     WebKit's backdrop filter on top: it can be dropped for a frame when the
     tray click transfers focus to the webview. */
  html.native-vibrancy #panel {
    background: transparent;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  html.windows-opaque,
  html.windows-opaque body {
    background: var(--panel);
  }
  html.windows-opaque #panel {
    border: 0;
    border-radius: 0;
    background: var(--panel);
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  .ph { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 4px; cursor: move; user-select: none; -webkit-user-select: none; }
  .ph .left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .pin { flex: none; width: 24px; height: 24px; border: none; border-radius: 6px; background: transparent;
         cursor: pointer; color: var(--ink-2); display: flex; align-items: center; justify-content: center; padding: 0; }
  .pin:hover { background: var(--btn); }
  .pin.active { color: var(--down); }
  .pin svg { width: 13px; height: 13px; }
  .ph .t {
    font-weight: 600; font-size: 13.5px;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ph .t small { font-weight: 400; opacity: .55; margin-left: 6px; font-size: 12px; }
  .chip { font-size: 11px; font-weight: 600; padding: 2.5px 9px; border-radius: 99px; background: var(--chip); opacity: .8; }
  .legend { display: flex; gap: 14px; padding: 6px 14px 2px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .legend .k { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
  .k.up { background: var(--up); } .k.down { background: var(--down); }
  .legend b { font-weight: 600; }
  .totals { padding: 1px 14px 0; font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  canvas#chart { display: block; width: calc(100% - 28px); height: 124px; margin: 6px auto 2px; flex: none; cursor: crosshair; }

  .sec-label {
    display: flex; align-items: center; gap: 8px; flex: none;
    padding: 6px 14px 4px;
    font-size: 11px; font-weight: 600; letter-spacing: .05em; color: var(--ink-2);
  }
  #node-search {
    flex: 1; min-width: 0; height: 22px; padding: 0 9px;
    font-family: inherit; font-size: 11.5px; font-weight: 400; letter-spacing: 0;
    color: var(--ink); background: var(--chip);
    border: none; border-radius: 99px; outline: none;
    -webkit-appearance: none; appearance: none;
    -webkit-user-select: text; user-select: text;
  }
  #node-search::placeholder { color: var(--ink-2); }
  #node-search::-webkit-search-cancel-button { -webkit-appearance: none; }
  .tagwrap { flex: none; position: relative; display: flex; }
  .tagbtn {
    position: relative;
    width: 22px; height: 22px; padding: 0; flex: none;
    display: flex; align-items: center; justify-content: center;
    border: none; border-radius: 99px; cursor: pointer;
    background: var(--chip); color: var(--ink-2);
  }
  .tagbtn:hover, .tagbtn.on { color: var(--ink); }
  .tagbtn svg { display: block; width: 12px; height: 12px; }
  /* 右下角的已选个数,同时充当"筛选生效中"的指示 */
  .tagbtn .cnt {
    position: absolute; right: -2px; bottom: -2px;
    min-width: 12px; height: 12px; padding: 0 2px; border-radius: 99px;
    background: var(--up); color: #0b1220;
    font-size: 8px; line-height: 12px; font-weight: 700; text-align: center;
    pointer-events: none;
  }
  /* 分组是单选,没有个数好显示;用一个实心点表示"筛选生效中" */
  .tagbtn .cnt.dot { min-width: 0; width: 7px; height: 7px; padding: 0; right: -1px; bottom: -1px; }
  /* display:flex 会盖掉 UA 的 [hidden]{display:none},得显式让位 */
  .tagbtn[hidden] { display: none; }
  /* 浮层而非行内块:标签多寡不该改变弹窗高度。方向与高度由 placePop
     按面板剩余空间决定 —— 筛掉大部分节点后面板会变矮,固定向下展开会被
     #panel 的 overflow: hidden 裁掉。 */
  .tagpop {
    position: absolute; top: calc(100% + 5px); right: 0; z-index: 5;
    display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start;
    width: 210px; overflow-y: auto;
    padding: 7px; border-radius: 9px;
    background: var(--pop); color: var(--ink);
    border: .5px solid var(--border);
    box-shadow: 0 8px 20px rgba(0, 0, 0, .22);
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .tagpop.up { top: auto; bottom: calc(100% + 5px); }
  .tagpop[hidden] { display: none; }
  .tagpop::-webkit-scrollbar { width: 0; height: 0; display: none; }
  .tagpop button {
    font-family: inherit; font-size: 9.5px; line-height: 16px; padding: 0 7px;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    border: none; border-radius: 99px; cursor: pointer;
    background: var(--chip); color: var(--ink-2);
  }
  .tagpop button:hover { color: var(--ink); }
  .tagpop button.on { background: var(--up); color: #0b1220; font-weight: 600; }
  .tagpop button.clear {
    flex: 0 0 100%; margin-top: 2px; line-height: 18px;
    background: transparent; color: var(--ink-2);
    border-top: .5px solid var(--border); border-radius: 0;
  }
  .tagpop button.clear:hover { color: var(--warn); }
  /* 排序弹窗是竖排菜单,不是标签那样的横向流式胶囊 */
  .tagpop.menu { width: 136px; flex-direction: column; flex-wrap: nowrap; gap: 1px; }
  .tagpop.menu button {
    width: 100%; text-align: left; border-radius: 6px;
    font-size: 11.5px; line-height: 20px; background: transparent;
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  .tagpop.menu button:hover { background: var(--chip); color: var(--ink); }
  .tagpop.menu button.on { background: transparent; color: var(--up); font-weight: 600; }
  .tagpop.menu button i { font-style: normal; opacity: .9; }
  /* 分组名来自后端,可能很长:压在菜单宽度内省略,别把浮层撑破 */
  .tagpop.menu button span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 节点区在高度被屏幕封顶后可滚动,但按要求不显示滚动条 */
  .nodes {
    flex: 1; min-height: 0; padding: 0 12px 6px;
    overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .nodes::-webkit-scrollbar { width: 0; height: 0; display: none; }

  .nrow { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px;
          border-radius: 7px; cursor: pointer; }
  .nrow:hover { background: var(--btn); }
  .nrow .flag { flex: none; width: 18px; text-align: center; }
  .nrow .flag img { width: 18px; height: 12px; border-radius: 2px; display: inline-block; vertical-align: -1px; }
  .nrow .flag .code { font-size: 9.5px; font-weight: 600; color: var(--ink-2); }
  .nrow .os { flex: none; width: 13px; height: 13px; color: var(--ink-2); display: flex; align-items: center; justify-content: center; }
  .nrow .os svg { display: block; width: 13px; height: 13px; }
  .nrow .os img { display: block; width: 13px; height: 13px; }
  .nrow .name { flex: 1; min-width: 0; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nrow .tags { flex: none; display: flex; gap: 4px; max-width: 45%; overflow: hidden; }
  .nrow .ntag {
    font-size: 9px; line-height: 13px; padding: 0 5px; border-radius: 99px;
    background: var(--chip); color: var(--ink-2); white-space: nowrap;
    max-width: 80px; overflow: hidden; text-overflow: ellipsis;
  }
  /* 指标徽章沿用格子图的配色:绿=好,黄=注意,红=告警 */
  .nrow .ntag.num { font-variant-numeric: tabular-nums; }
  /* 速率徽章分三栏:箭头 | 数值 | 单位。三栏都定宽,数值右对齐贴着单位栏,
     所以不管是 1.7M 还是 340K,相邻两行的数字都落在同一条竖线上。
     箭头与单位用次级色,读的时候先看到数字。 */
  .nrow .ntag.rate { display: inline-flex; align-items: baseline; width: 52px; color: var(--ink); }
  .nrow .ntag.rate .sym { flex: none; width: 7px; margin-right: 3px; color: var(--ink-2); }
  .nrow .ntag.rate .val { flex: 1; text-align: right; }
  .nrow .ntag.rate .unit { flex: none; width: 9px; margin-left: 2px; text-align: left; color: var(--ink-2); }
  .nrow .ntag.g { color: var(--down); }
  .nrow .ntag.a { color: var(--amber); }
  .nrow .ntag.r { color: var(--warn); }
  .nrow .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--down); }
  .nrow .dot.off { background: var(--off); }
  .nrow .chev { flex: none; width: 14px; text-align: center; font-size: 10px; color: var(--ink-2);
                transition: transform .15s; }
  .card.open > .nrow .chev { transform: rotate(90deg); }

  .card { margin-bottom: 2px; }
  .nbody { display: none; padding: 2px 8px 8px; }
  .card.open > .nbody { display: block; }
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 12px; padding: 2px 0 3px;
               font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .meta-grid span { display: flex; justify-content: space-between; gap: 5px; min-width: 0; }
  .meta-grid b { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nbody .rates { font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; padding: 2px 0 3px; }
  canvas.mini { display: block; width: 100%; height: 82px; cursor: crosshair; }
  .bar-row { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--ink-2); margin-top: 6px; }
  .bar-row .lbl { width: 26px; flex: none; }
  .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; background: var(--up); transition: width .4s; }
  .bar.mem i { background: var(--down); }
  .bar.disk i { background: var(--amber); }
  .bar.traffic i { background: var(--traffic); }
  .bar.hot i { background: var(--warn); }
  .bar-row .pv { width: 38px; flex: none; text-align: right; font-variant-numeric: tabular-nums; }

  .stat { margin-top: 8px; display: grid; gap: 4px; }
  .stat-row { display: flex; align-items: center; gap: 7px; }
  .stat-lbl { flex: none; width: 30px; font-size: 10.5px; color: var(--ink-2); }
  .cells { flex: 1; display: flex; gap: 3px; }
  .cells i { position: relative; flex: 1; height: 13px; border-radius: 2.5px; background: var(--chip);
             outline: 1.5px solid transparent; outline-offset: 1px; cursor: crosshair;
             transition: filter .08s ease, outline-color .08s ease; }
  .cells i.g { background: var(--down); }
  .cells i.a { background: var(--amber); }
  .cells i.r { background: var(--warn); }
  .cells i:hover { outline-color: var(--ink); filter: brightness(1.08); z-index: 1; }

  .cell-tooltip {
    position: fixed; left: 0; top: 0; z-index: 100; min-width: 62px; padding: 4px 7px;
    border: .5px solid var(--tooltip-border); border-radius: 6px;
    background: var(--tooltip); color: var(--tooltip-ink);
    box-shadow: 0 3px 12px rgba(0, 0, 0, .22);
    font-size: 11px; line-height: 1.25; text-align: center; white-space: nowrap;
    font-variant-numeric: tabular-nums; pointer-events: none;
    opacity: 0; visibility: hidden;
    transform: translate(-50%, calc(-100% - 6px)) scale(.96);
    transform-origin: center bottom;
    transition: opacity .08s ease, transform .08s ease, visibility 0s linear .08s;
  }
  .cell-tooltip::after {
    content: ""; position: absolute; left: 50%; bottom: -4px; width: 7px; height: 7px;
    background: var(--tooltip); border-right: .5px solid var(--tooltip-border);
    border-bottom: .5px solid var(--tooltip-border); transform: translateX(-50%) rotate(45deg);
  }
  .cell-tooltip.show { opacity: 1; visibility: visible;
                       transform: translate(-50%, calc(-100% - 6px)) scale(1);
                       transition-delay: 0s; }
  .cell-tooltip.below { transform: translate(-50%, 6px) scale(.96); transform-origin: center top; }
  .cell-tooltip.below.show { transform: translate(-50%, 6px) scale(1); }
  .cell-tooltip.below::after { top: -4px; bottom: auto; border: 0;
                               border-left: .5px solid var(--tooltip-border);
                               border-top: .5px solid var(--tooltip-border); }
  .cell-tooltip .tip-value { margin-top: 1px; font-weight: 600; }

  .pf { display: flex; gap: 8px; padding: 8px 12px 12px; flex: none; }
  .pf button {
    flex: 1; height: 30px; border-radius: 7px; border: none; cursor: pointer;
    font-size: 12.5px; font-weight: 500; font-family: inherit;
    background: var(--btn); color: var(--ink);
  }
  .pf button:active { opacity: .7; }
</style>
</head>
<body>
<div id="panel">
  <div class="ph" id="header">
    <span class="left">
      <button class="pin" id="btn-pin" title="固定显示（失焦不关闭）" aria-label="固定显示">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 17v5"/>
          <path d="M9 4h6l1 6 2.5 2.5a1 1 0 0 1-.7 1.5H6.2a1 1 0 0 1-.7-1.5L8 10z"/>
        </svg>
      </button>
      <span class="t" id="title">汇总<small>…</small></span>
    </span>
    <span class="chip" id="range-chip">…</span>
  </div>
  <div class="legend">
    <span><i class="k up"></i>上行 <b id="up-now">—</b></span>
    <span><i class="k down"></i>下行 <b id="down-now">—</b></span>
  </div>
  <div class="totals">累计流量 ↑ <b id="total-up">—</b> · ↓ <b id="total-down">—</b></div>
  <canvas id="chart"></canvas>
  <div class="sec-label">
    <span>节点</span>
    <input id="node-search" type="search" placeholder="搜索名称或标签" autocomplete="off" spellcheck="false" aria-label="搜索节点名称或标签">
    <span class="tagwrap">
      <button class="tagbtn" id="btn-tags" type="button" hidden aria-expanded="false" aria-haspopup="true" title="按标签筛选" aria-label="按标签筛选">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/>
        </svg>
      </button>
      <div class="tagpop" id="tagpop" hidden role="group" aria-label="按标签筛选"></div>
    </span>
    <span class="tagwrap">
      <button class="tagbtn" id="btn-sort" type="button" aria-expanded="false" aria-haspopup="true" title="排序" aria-label="排序">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7h16M7 12h10M10 17h4"/>
        </svg>
      </button>
      <div class="tagpop menu" id="sortpop" hidden role="group" aria-label="排序方式"></div>
    </span>
    <span class="tagwrap">
      <button class="tagbtn" id="btn-group" type="button" hidden aria-expanded="false" aria-haspopup="true" title="按分组筛选" aria-label="按分组筛选">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/>
        </svg>
      </button>
      <div class="tagpop menu" id="grouppop" hidden role="group" aria-label="按分组筛选"></div>
    </span>
  </div>
  <div class="nodes" id="nodes"><div class="empty" style="color:var(--ink-2);font-size:12px;text-align:center;padding:18px 0;">等待数据…</div></div>
  <div class="pf">
    <button id="btn-panel">打开面板</button>
    <button id="btn-settings">设置…</button>
  </div>
</div>
<div class="cell-tooltip" id="cell-tooltip" role="tooltip" aria-hidden="true">
  <div class="tip-time"></div><div class="tip-value"></div>
</div>

<script>
const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;
const win = window.__TAURI__.window.getCurrentWindow();

const RANGE_LABELS = { 300: '5 分钟', 900: '15 分钟', 3600: '1 小时', 21600: '6 小时' };
const FRONT_BUFFER_MS = 6 * 3600 * 1000;
const GRID_BUCKETS = 12, GRID_BUCKET_MS = 5 * 60 * 1000; // 12 × 5min = 1h
const CELL_TIME_FORMAT = new Intl.DateTimeFormat('zh-CN', {
  hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
});

let rangeSecs = 900;
let cpuWarnPct = 80, memWarnPct = 85;
let points = [];                 // aggregate [{t, up, down}]
let nodeSeries = new Map();      // uuid -> [{t, up, down, online}]
let nodeMeta = new Map();        // uuid -> {name, online, cpu, memPct, uptime, region, os}
let expandedUuid = null;         // accordion: which node card is open
let hiddenNodes = new Set();     // uuids the user unchecked in 设置 → 节点
let nodeQuery = '';              // 搜索框内容(小写),匹配名称或标签
let activeTags = new Set();      // 选中的标签,任一命中即显示(OR)
// 选中的分组。一个节点在 Komari 里最多属于一个分组,所以这里是单选:
// null = 全部分组(默认,不筛选),'' = 未分组,其余为分组名。
let activeGroup = null;
// 折叠行里名称后面显示什么(设置 → 外观):标签,或一组实时指标。
// 指标模式下的槽位数量,由 buildNodes 建好、patchNodes 就地填值。
const BADGE_SLOTS = { ping: 2, net: 2, expiry: 1 };
let nodeBadge = 'tags';
// 排序:再次点同一项就反向。默认按名称升序。
const SORT_KEYS = [
  ['name', '名称'], ['os', '系统'], ['cpu', 'CPU'], ['mem', '内存'],
  ['net', '网络速率'], ['traffic', '流量'], ['lat', '延迟'], ['loss', '丢包'],

function isDarkTheme() {

function fmtRate(bps) {
  if (bps >= 1048576) return (bps / 1048576).toFixed(1) + ' MB/s';
  if (bps >= 1024) return (bps / 1024).toFixed(1) + ' KB/s';
  return bps.toFixed(0) + ' B/s';
}

function fmtBytes(b) {
  if (b >= 1099511627776) return (b / 1099511627776).toFixed(2) + ' TB';
  if (b >= 1073741824) return (b / 1073741824).toFixed(2) + ' GB';
  if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB';
  if (b >= 1024) return (b / 1024).toFixed(1) + ' KB';
  return b.toFixed(0) + ' B';
}

function fmtUptime(s) {
  s = Math.max(0, Math.floor(s));
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  if (d > 0) return d + '天' + h + '小时';
  if (h > 0) return h + '小时' + m + '分钟';
  return m + '分钟';
}

// 徽章里的速率只有几十像素宽,用 1.2M/340K/12B 这种紧凑写法,完整值放 title。
// 数值与单位分开返回:单位要单独着色,数值要单独定宽对齐。
// 数值最多三位:四位数会把箭头那一栏挤没。所以按进位后的结果再判一次单位 ——
// 1023.6K 显示成 1.0M,而不是 1024K。
function rateParts(bps) {
  if (!Number.isFinite(bps) || bps < 0) bps = 0;
  if (bps >= 1048576) {
    const m = bps / 1048576;
    return m >= 999.95
      ? { value: (bps / 1073741824).toFixed(1), unit: 'G' }
      : { value: m.toFixed(1), unit: 'M' };
  }
  if (bps >= 1024) {
    const k = Math.round(bps / 1024);
    return k >= 1000
      ? { value: (bps / 1048576).toFixed(1), unit: 'M' }
      : { value: String(k), unit: 'K' };
  }
  const b = Math.round(bps);
  return b >= 1000
    ? { value: String(Math.round(bps / 1024)), unit: 'K' }
    : { value: String(b), unit: 'B' };
}

// 距到期还有几天;没设到期时间或时间解析不了都返回 null。
function remainingDays(expiredAt) {
  if (!expiredAt) return null;
  const expires = Date.parse(expiredAt);
  if (!Number.isFinite(expires)) return null;
  return Math.ceil((expires - Date.now()) / 86400000);
}

function fmtRemaining(expiredAt) {
  const days = remainingDays(expiredAt);
  if (days === null) return expiredAt ? '—' : '长期';
  if (days <= 0) return '已到期';
  if (days >= 365) return Math.floor(days / 365) + '年' + (days % 365) + '天';
  if (days >= 30) return Math.floor(days / 30) + '个月' + (days % 30) + '天';
  return days + '天';
}

function trafficUsed(meta) {
  switch ((meta.trafficLimitType || 'max').toLowerCase()) {
    case 'sum': return meta.totalUp + meta.totalDown;
    case 'min': return Math.min(meta.totalUp, meta.totalDown);
    case 'up': return meta.totalUp;
    case 'down': return meta.totalDown;
    default: return Math.max(meta.totalUp, meta.totalDown);
  }
}

function fmtAxis(v) {
  if (v >= 1048576) return (v / 1048576).toFixed(1) + 'M';
  if (v >= 1024) return (v / 1024).toFixed(0) + 'K';
  return v.toFixed(0);
}

function niceCeil(v) {
  if (v <= 0) return 1024;
  const e = Math.pow(10, Math.floor(Math.log10(v)));
  const m = v / e;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * e;
}

function countryCodeOf(region) {
  const r = (region || '').trim();
  if (!r) return '';
  // Komari 常直接存 emoji 旗帜(如 "🇺🇸"),还原为两位代码
  const emoji = r.match(/([\u{1F1E6}-\u{1F1FF}])([\u{1F1E6}-\u{1F1FF}])/u);
  if (emoji) {
    const code = String.fromCodePoint(
      emoji[1].codePointAt(0) - 0x1F1E6 + 65,
      emoji[2].codePointAt(0) - 0x1F1E6 + 65,
    );
    if (/^[A-Z]{2}$/.test(code)) return code;
  }
  const m = r.toUpperCase().match(/(?:^|[^A-Z])([A-Z]{2})(?:$|[^A-Z])/);
  const code = REGION_CODES[r.toLowerCase()] || (m && m[1]);
  return code && /^[A-Z]{2}$/.test(code) ? code : '';
}

function bucketize(data, columns) {
  if (data.length <= columns) return data;
  const step = Math.ceil(data.length / columns);
  const out = [];
  for (let i = 0; i < data.length; i += step) {
    let up = 0, down = 0, cnt = 0;
    const end = Math.min(i + step, data.length);
    for (let j = i; j < end; j++) {
      up += data[j].up; down += data[j].down; cnt++;
    }
    out.push({
      t: data[Math.floor((i + end - 1) / 2)].t,
      up: up / cnt,
      down: down / cnt,
      online: data[end - 1].online,
    });
  }
  return out;
}

function smoothPath(ctx, p, xOf) {
  ctx.beginPath();
  ctx.moveTo(xOf(p[0].t), p[0].y);
  for (let i = 1; i < p.length - 1; i++) {
    const mx = (xOf(p[i].t) + xOf(p[i + 1].t)) / 2;
    const my = (p[i].y + p[i + 1].y) / 2;
    ctx.quadraticCurveTo(xOf(p[i].t), p[i].y, mx, my);
  }
  ctx.lineTo(xOf(p[p.length - 1].t), p[p.length - 1].y);
}

function strokeSeries(ctx, data, xOf, yOf, padT, padH) {
  [['52,211,153', 'down'], ['56,189,248', 'up']].forEach(([rgb, key]) => {
    const p = data.map((d) => ({ t: d.t, y: yOf(d[key]) }));
    smoothPath(ctx, p, xOf);
    const fill = ctx.createLinearGradient(0, padT, 0, padT + padH);
    fill.addColorStop(0, 'rgba(' + rgb + ',.28)');
    fill.addColorStop(1, 'rgba(' + rgb + ',0)');
    ctx.lineTo(xOf(p[p.length - 1].t), padT + padH);
    ctx.lineTo(xOf(p[0].t), padT + padH);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    smoothPath(ctx, p, xOf);
    ctx.strokeStyle = 'rgb(' + rgb + ')';
    ctx.lineWidth = 1.6;
    ctx.lineJoin = 'round';
    ctx.stroke();
  });
}

const AXIS_TIME_FORMAT = new Intl.DateTimeFormat('zh-CN', {
  hour: '2-digit', minute: '2-digit', hour12: false,
});

function roundedRectPath(ctx, x, y, w, h, r) {
  const radius = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.arcTo(x + w, y, x + w, y + h, radius);
  ctx.arcTo(x + w, y + h, x, y + h, radius);
  ctx.arcTo(x, y + h, x, y, radius);
  ctx.arcTo(x, y, x + w, y, radius);
  ctx.closePath();
}

function nearestByTime(data, target) {
  let lo = 0, hi = data.length - 1;
  while (lo < hi) {
    const mid = Math.floor((lo + hi) / 2);
    if (data[mid].t < target) lo = mid + 1; else hi = mid;
  }
  if (lo > 0 && Math.abs(data[lo - 1].t - target) < Math.abs(data[lo].t - target)) return data[lo - 1];
  return data[lo];
}

function drawChartHover(ctx, state) {
  const { cv, data, hover, xOf, yOf, start, spanMs, padL, padR, padT, padB, W, H, dark } = state;
  if (!hover || !data.length || hover.x < padL || hover.x > W - padR || hover.y < padT || hover.y > H - padB) return;

  const target = start + ((hover.x - padL) / (W - padL - padR)) * spanMs;
  const point = nearestByTime(data, target);
  const x = xOf(point.t);
  const upY = yOf(point.up), downY = yOf(point.down);
  const cross = dark ? 'rgba(255,255,255,.34)' : 'rgba(0,0,0,.28)';

  ctx.save();
  ctx.strokeStyle = cross;
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, H - padB); ctx.stroke();
  ctx.setLineDash([]);

  [['#38bdf8', upY], ['#34d399', downY]].forEach(([color, y]) => {
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.fill();
    ctx.strokeStyle = dark ? '#252527' : '#f6f6f8'; ctx.lineWidth = 1.5; ctx.stroke();
  });

  ctx.font = '10px -apple-system, "Segoe UI", sans-serif';
  const timeText = CELL_TIME_FORMAT.format(new Date(point.t));
  const status = point.online === false ? '离线 · ' : '';
  const valueText = status + '↑ ' + fmtRate(point.up) + '  ↓ ' + fmtRate(point.down);
  const boxW = Math.ceil(Math.max(ctx.measureText(timeText).width, ctx.measureText(valueText).width)) + 14;
  const boxH = 34;
  const boxX = Math.max(3, Math.min(W - boxW - 3, x - boxW / 2));
  const boxY = padT + 3;
  roundedRectPath(ctx, boxX, boxY, boxW, boxH, 6);
  ctx.fillStyle = dark ? 'rgba(239,239,242,.96)' : 'rgba(38,38,40,.94)';
  ctx.fill();
  ctx.fillStyle = dark ? '#1d1d1f' : '#f7f7f8';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(timeText, boxX + boxW / 2, boxY + 10);
  ctx.font = '600 10px -apple-system, "Segoe UI", sans-serif';
  ctx.fillText(valueText, boxX + boxW / 2, boxY + 24);
  ctx.restore();
  cv.setAttribute('aria-label', timeText + '，' + valueText);
}

function requestChartRedraw(cv) {
  if (cv._hoverFrame) return;
  cv._hoverFrame = requestAnimationFrame(() => {
    cv._hoverFrame = null;
    if (cv.id === 'chart') drawAggregate();
    else drawMini(cv, cv._series || []);
  });
}

function bindChartHover(cv) {
  if (cv._hoverBound) return;
  cv._hoverBound = true;
  cv.addEventListener('pointermove', (event) => {
    const rect = cv.getBoundingClientRect();
    cv._hover = { x: event.clientX - rect.left, y: event.clientY - rect.top };
    requestChartRedraw(cv);
  });
  cv.addEventListener('pointerleave', () => {
    cv._hover = null;
    cv.removeAttribute('aria-label');
    requestChartRedraw(cv);
  });
}

// All traffic charts share one time window and scale for direct comparison.
function networkChartDomain(now, range, aggregate, nodes) {
  const end = Math.floor(now / 1000) * 1000;
  const start = end - range * 1000;
  let peak = 0;
  for (const series of [aggregate, ...nodes]) {
    for (const point of series) {
      if (point.t >= start && point.t <= end) peak = Math.max(peak, point.up, point.down);
    }
  }
  return { start, end, spanMs: range * 1000, max: niceCeil(peak * 1.12) };
}

function drawNetworkChart(cv, series, compact) {
  if (!cv.clientWidth) return;
  bindChartHover(cv);
  cv._series = series;
  cv.setAttribute('role', 'img');
  cv.setAttribute('aria-label', compact ? '节点网络速率曲线' : '总览网络速率曲线');
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);

  const dark = isDarkTheme();
  const txt = dark ? 'rgba(255,255,255,.45)' : 'rgba(0,0,0,.4)';
  const grid = dark ? 'rgba(255,255,255,.10)' : 'rgba(0,0,0,.08)';
  const padL = 44, padR = 7, padT = 8, padB = 18;
  const pw = W - padL - padR, ph = H - padT - padB;

  const { start, end, spanMs, max } = networkChartDomain(
    Date.now(), rangeSecs, points, nodeSeries.values(),
  );
  const xOf = (t) => padL + pw * Math.min(1, Math.max(0, (t - start) / spanMs));

  ctx.lineWidth = 1;
  ctx.font = '9.5px -apple-system, "Segoe UI", sans-serif';
  ctx.fillStyle = txt;

  const yTicks = 4;
  for (let g = 0; g < yTicks; g++) {
    const y = padT + (ph * g) / (yTicks - 1);
    ctx.strokeStyle = grid;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
  }

  const xTicks = 4;
  ctx.textAlign = 'center';
  ctx.fillStyle = txt;
  for (let i = 0; i < xTicks; i++) {
    const ratio = i / (xTicks - 1);
    const x = padL + pw * ratio;
    if (i > 0 && i < xTicks - 1) {
      ctx.strokeStyle = grid;
      ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, H - padB); ctx.stroke();
    }
    ctx.textAlign = i === 0 ? 'left' : i === xTicks - 1 ? 'right' : 'center';
    ctx.fillText(AXIS_TIME_FORMAT.format(new Date(start + spanMs * ratio)), x, H - 4);
  }

  const visible = (series || []).filter((p) => p.t >= start && p.t <= end);
  const yOf = (v) => padT + ph * (1 - Math.min(1, v / max));

  ctx.textAlign = 'right';
  ctx.textBaseline = 'alphabetic';
  for (let g = 0; g < yTicks; g++) {
    ctx.fillStyle = txt;
    const value = max * (1 - g / (yTicks - 1));
    ctx.fillText(fmtAxis(value), padL - 5, padT + (ph * g) / (yTicks - 1) + 3);
  }

  if (visible.length < 2) {
    return; // 数据不足时留空,不画占位文字
  }

  const data = bucketize(visible, Math.max(2, Math.floor(pw)));
  strokeSeries(ctx, data, xOf, yOf, padT, ph);
  drawChartHover(ctx, {
    cv, data, hover: cv._hover, xOf, yOf, start, spanMs,
    padL, padR, padT, padB, W, H, dark,
  });
}

function drawAggregate() {
  drawNetworkChart(document.getElementById('chart'), points, false);
}

function drawMini(cv, series) {
  drawNetworkChart(cv, series, true);
}

let nodesKey = null;

// 未勾选的节点只是不进列表:图标、悬浮提示与汇总曲线仍按全部节点统计。
// 搜索与标签筛选叠加在它之上,只影响列表,不影响统计。
function sortValue(uuid, meta) {
  switch (sortKey) {
    case 'os': return (meta.os || '').toLowerCase();
    case 'cpu': return meta.cpu;
    case 'mem': return meta.memPct;
    case 'net': {
      const s = nodeSeries.get(uuid);
      const last = s && s[s.length - 1];
      return last ? last.up + last.down : 0;
    }
    case 'traffic': return (meta.totalUp || 0) + (meta.totalDown || 0);
    case 'lat': return meta.latency;
    case 'loss': return meta.loss;
    case 'expiry': return meta.expiredAt ? Date.parse(meta.expiredAt) : null;
    default: return (meta.name || '').toLowerCase();
  }
}

function byName(a, b) {
  return (nodeMeta.get(a)?.name || '').localeCompare(nodeMeta.get(b)?.name || '', 'zh-CN');
}

function compareNodes(a, b) {
  const va = sortValue(a, nodeMeta.get(a));
  const vb = sortValue(b, nodeMeta.get(b));
  // 没有数据的(没配 ping 任务、没有到期时间)永远排在最后,不随升降序翻面
  const ma = va == null || (typeof va === 'number' && !Number.isFinite(va));
  const mb = vb == null || (typeof vb === 'number' && !Number.isFinite(vb));
  if (ma !== mb) return ma ? 1 : -1;
  if (ma) return byName(a, b);
  const r = typeof va === 'string' ? va.localeCompare(vb, 'zh-CN') : va - vb;
  // 同值时退回名称,免得每次刷新顺序都在抖
  return (sortAsc ? r : -r) || byName(a, b);
}

// 顺序按"成员+排序设置"缓存:CPU、网络速率这类值每秒都在变,若每次刷新都重排,
// 列表会一直抖到没法点。刷新(重新聚焦弹窗)或改排序时才重新算。
let orderCache = { key: null, uuids: [] };

function visibleUuids() {
  const filtered = [...nodeMeta.keys()].filter((uuid) => {
    if (hiddenNodes.has(uuid)) return false;
    const meta = nodeMeta.get(uuid);
    const tags = meta.tags || [];
    if (activeGroup !== null && (meta.group || '') !== activeGroup) return false;
    if (activeTags.size && !tags.some((tag) => activeTags.has(tag))) return false;
    if (!nodeQuery) return true;
    return (meta.name || '').toLowerCase().includes(nodeQuery)
      || tags.some((tag) => tag.toLowerCase().includes(nodeQuery));
  });
  const key = sortKey + '|' + sortAsc + '|' + filtered.join(',');
  if (orderCache.key !== key) orderCache = { key, uuids: filtered.sort(compareNodes) };
  return orderCache.uuids;
}

// 标签栏只列出未被隐藏的节点身上的标签
function tagUniverse() {
  const tags = new Set();
  for (const [uuid, meta] of nodeMeta) {
    if (hiddenNodes.has(uuid)) continue;
    for (const tag of meta.tags || []) tags.add(tag);
  }
  return [...tags].sort((a, b) => a.localeCompare(b, 'zh-CN'));
}

// 分组栏同样只看未被隐藏的节点
function groupUniverse() {
  const groups = new Set();
  let ungrouped = false;
  for (const [uuid, meta] of nodeMeta) {
    if (hiddenNodes.has(uuid)) continue;
    if (meta.group) groups.add(meta.group);
    else ungrouped = true;
  }
  const list = [...groups].sort((a, b) => a.localeCompare(b, 'zh-CN'));
  // 后端只给一部分节点配了分组时,剩下的也得有办法单独看
  if (ungrouped && list.length) list.push('');
  return list;
}

let tagbarKey = null;
let groupbarKey = null;
// 同时只开一个浮层:null | 'tags' | 'sort' | 'group'
const POPS = {
  tags: { pop: 'tagpop', btn: 'btn-tags' },
  sort: { pop: 'sortpop', btn: 'btn-sort' },
  group: { pop: 'grouppop', btn: 'btn-group' },
};
let openPop = null;

// 浮层而不是行内块,所以内容多寡不会改变面板高度
function setPop(which) {
  if (which && document.getElementById(POPS[which].btn).hidden) which = null;
  openPop = which;
  for (const [name, ids] of Object.entries(POPS)) {
    const on = name === which;
    document.getElementById(ids.pop).hidden = !on;
    document.getElementById(ids.btn).setAttribute('aria-expanded', on ? 'true' : 'false');
    if (on) placePop(name);
  }
}

// 面板高度随筛选后的节点数变化,筛剩一两个节点时会矮到装不下浮层,而
// #panel 是 overflow: hidden,固定向下展开就会被裁掉。所以每次显示时按
// 上下剩余空间选方向,并把 max-height 压到真正能放下的尺寸(内部滚动)。
function placePop(which) {
  const ids = POPS[which];
  const pop = document.getElementById(ids.pop);
  const panel = document.getElementById('panel').getBoundingClientRect();
  const anchor = document.getElementById(ids.btn).getBoundingClientRect();
  const GAP = 5, EDGE = 8;
  const below = panel.bottom - anchor.bottom - GAP - EDGE;
  const above = anchor.top - panel.top - GAP - EDGE;
  const up = above > below;
  pop.classList.toggle('up', up);
  pop.style.maxHeight = Math.max(48, Math.floor(up ? above : below)) + 'px';
}

function renderSortPop() {
  const btn = document.getElementById('btn-sort');
  const arrow = sortAsc ? '↑' : '↓';
  const label = (SORT_KEYS.find(([id]) => id === sortKey) || [, '名称'])[1];
  btn.title = '排序：' + label + ' ' + arrow + '（再点一次换方向）';
  btn.setAttribute('aria-label', btn.title);
  let cnt = btn.querySelector('.cnt');
  if (!cnt) {
    cnt = document.createElement('span');
    cnt.className = 'cnt';
    cnt.setAttribute('aria-hidden', 'true');
    btn.appendChild(cnt);
  }
  cnt.textContent = arrow;

  const pop = document.getElementById('sortpop');
  pop.innerHTML = '';
  for (const [id, text] of SORT_KEYS) {
    const item = document.createElement('button');
    item.type = 'button';
    item.className = id === sortKey ? 'on' : '';
    item.setAttribute('aria-pressed', id === sortKey ? 'true' : 'false');
    const name = document.createElement('span');
    name.textContent = text;
    item.appendChild(name);
    if (id === sortKey) {
      const dir = document.createElement('i');
      dir.textContent = arrow;
      item.appendChild(dir);
    }
    item.addEventListener('click', (ev) => {
      ev.stopPropagation();
      if (id === sortKey) sortAsc = !sortAsc;
      else { sortKey = id; sortAsc = true; }
      orderCache.key = null;
      renderSortPop();
      if (openPop === 'sort') placePop('sort');
      syncNodes();
    });
    pop.appendChild(item);
  }
}

// 单选菜单:选中"全部分组"就是不筛选,按钮上也就不该有下标 —— 下标同时
// 充当"筛选生效中"的指示,分组是单选没有个数好显示,所以用一个实心点。
function renderGroupbar() {
  const groups = groupUniverse();
  // 选中的分组消失了(节点下线或被隐藏)就退回全部,否则会永久筛空
  if (activeGroup !== null && !groups.includes(activeGroup)) activeGroup = null;
  const key = groups.join('\n') + '|' + activeGroup;
  if (key === groupbarKey) return;
  groupbarKey = key;

  const btn = document.getElementById('btn-group');
  btn.hidden = !groups.length;
  btn.classList.toggle('on', activeGroup !== null);
  const label = activeGroup === null
    ? '按分组筛选'
    : '按分组筛选（' + (activeGroup || '未分组') + '）';
  btn.title = label;
  btn.setAttribute('aria-label', label);
  let cnt = btn.querySelector('.cnt');
  if (activeGroup !== null) {
    if (!cnt) {
      cnt = document.createElement('span');
      cnt.className = 'cnt dot';
      cnt.setAttribute('aria-hidden', 'true');
      btn.appendChild(cnt);
    }
  } else if (cnt) {
    cnt.remove();
  }
  if (btn.hidden && openPop === 'group') setPop(null);

  const pop = document.getElementById('grouppop');
  pop.innerHTML = '';
  const items = [[null, '全部分组'], ...groups.map((g) => [g, g || '未分组'])];
  for (const [value, text] of items) {
    const item = document.createElement('button');
    item.type = 'button';
    const on = value === activeGroup;
    item.className = on ? 'on' : '';
    item.setAttribute('aria-pressed', on ? 'true' : 'false');
    const name = document.createElement('span');
    name.textContent = text;              // 后端内容,只用 textContent
    item.appendChild(name);
    if (on) {
      const mark = document.createElement('i');
      mark.textContent = '✓';
      item.appendChild(mark);
    }
    item.addEventListener('click', (ev) => {
      // 同 renderTagbar:重建会把这个按钮从 DOM 摘掉,冒泡到 document 时
      // closest 就找不到 #grouppop,外部点击处理器会误判成"点在外面"。
      ev.stopPropagation();
      if (value === activeGroup) return;
      activeGroup = value;
      groupbarKey = null;
      renderGroupbar();
      syncNodes();
    });
    pop.appendChild(item);
  }
  // 内容变了高度也变,重新量一次剩余空间
  if (openPop === 'group') placePop('group');
}

function renderTagbar() {
  const tags = tagUniverse();
  // 选中的标签消失了(节点下线或被隐藏)就撤掉它,否则会永久筛空
  for (const tag of [...activeTags]) {
    if (!tags.includes(tag)) activeTags.delete(tag);
  }
  const key = tags.join('␀') + '|' + [...activeTags].sort().join('␀');
  if (key === tagbarKey) return;
  tagbarKey = key;

  const btn = document.getElementById('btn-tags');
  btn.hidden = !tags.length;
  btn.classList.toggle('on', activeTags.size > 0);
  const label = activeTags.size
    ? '按标签筛选（已选 ' + activeTags.size + ' 个）'
    : '按标签筛选';
  btn.title = label;
  btn.setAttribute('aria-label', label);
  let cnt = btn.querySelector('.cnt');
  if (activeTags.size) {
    if (!cnt) {
      cnt = document.createElement('span');
      cnt.className = 'cnt';
      cnt.setAttribute('aria-hidden', 'true');
      btn.appendChild(cnt);
    }
    cnt.textContent = String(activeTags.size);
  } else if (cnt) {
    cnt.remove();
  }
  if (btn.hidden && openPop === 'tags') setPop(null);

  const pop = document.getElementById('tagpop');
  pop.innerHTML = '';
  for (const tag of tags) {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.textContent = tag;               // 后端内容,只用 textContent
    chip.className = activeTags.has(tag) ? 'on' : '';
    chip.setAttribute('aria-pressed', activeTags.has(tag) ? 'true' : 'false');
    chip.addEventListener('click', (ev) => {
      // 重建会把这个 chip 从 DOM 摘掉,冒泡到 document 时 closest 就找不到
      // #tagpop 了,外部点击处理器会误判成"点在外面"而收起弹窗。
      ev.stopPropagation();
      if (activeTags.has(tag)) activeTags.delete(tag);
      else activeTags.add(tag);
      tagbarKey = null;
      renderTagbar();
      syncNodes();
    });
    pop.appendChild(chip);
  }
  if (activeTags.size) {
    const clear = document.createElement('button');
    clear.type = 'button';
    clear.className = 'clear';
    clear.textContent = '清除全部';
    clear.addEventListener('click', (ev) => {
      ev.stopPropagation();
      activeTags.clear();
      tagbarKey = null;
      renderTagbar();
      syncNodes();
    });
    pop.appendChild(clear);
  }
  // 内容变了高度也变,重新量一次剩余空间
  if (openPop === 'tags') placePop('tags');
}

function nodesKeyOf() {
  // 标签也进 key,后端改了标签下次刷新就能重建出来。
  // 徽章模式换了要重排槽位,同样进 key。
  return visibleUuids()
    .map((uuid) => uuid + ':' + (nodeMeta.get(uuid).tags || []).join('|'))
    .join(',') + '|' + expandedUuid + '|' + nodeBadge;
}

function syncNodes() {
  renderTagbar();
  renderGroupbar();
  const key = nodesKeyOf();
  if (key !== nodesKey) {
    nodesKey = key;
    buildNodes();
  }
  // 重建后也补一次数值:buildNodes 只搭骨架,不然新槽位要空到下一次轮询。
  patchNodes();
}

// 网络质量:后端 /api/records/ping(每 5 分钟一格,共 1 小时)。
// 延迟行:绿 <100ms / 黄 <200ms / 红 ≥200ms;丢包行:绿 0% / 黄 ≤5% / 红 >5%。
const pingSeries = new Map(); // uuid -> [{t, v, task_id}] v = 延迟 ms,负值表示该次探测丢包

function renderPingGrid(uuid, refs) {
  const now = Date.now();
  const start = now - GRID_BUCKETS * GRID_BUCKET_MS;
  const recs = (pingSeries.get(uuid) || []).filter((p) => p.t >= start);
  const cnt = new Array(GRID_BUCKETS).fill(0);
  const lossCnt = new Array(GRID_BUCKETS).fill(0);
  const latSum = new Array(GRID_BUCKETS).fill(0);
  const latCnt = new Array(GRID_BUCKETS).fill(0);
  const latestAt = new Array(GRID_BUCKETS).fill(0);
  for (const p of recs) {
    const b = Math.min(GRID_BUCKETS - 1, Math.max(0, Math.floor((p.t - start) / GRID_BUCKET_MS)));
    cnt[b]++;
    latestAt[b] = Math.max(latestAt[b], p.t);
    if (p.v >= 0) { latSum[b] += p.v; latCnt[b]++; } else { lossCnt[b]++; }
  }
  for (let b = 0; b < GRID_BUCKETS; b++) {
    const lat = refs.rowLat.children[b], loss = refs.rowLoss.children[b];
    const bucketTime = latestAt[b] || start + (b + .5) * GRID_BUCKET_MS;
    const time = CELL_TIME_FORMAT.format(new Date(bucketTime));
    lat.dataset.tipTime = loss.dataset.tipTime = time;
    if (!cnt[b]) {
      lat.className = '';
      loss.className = '';
      lat.dataset.tipValue = loss.dataset.tipValue = '无数据';
      lat.setAttribute('aria-label', time + '，延迟无数据');
      loss.setAttribute('aria-label', time + '，丢包无数据');
      continue;
    }
    const avg = latSum[b] / latCnt[b];
    lat.className = !latCnt[b] ? 'r' : avg < 100 ? 'g' : avg < 200 ? 'a' : 'r';
    const ratio = lossCnt[b] / cnt[b];
    loss.className = ratio === 0 ? 'g' : ratio <= 0.05 ? 'a' : 'r';
    lat.dataset.tipValue = latCnt[b] ? Math.round(avg) + ' ms' : '无响应';
    loss.dataset.tipValue = (ratio * 100).toFixed(1) + '%';
    lat.setAttribute('aria-label', time + '，延迟' + lat.dataset.tipValue);
    loss.setAttribute('aria-label', time + '，丢包' + loss.dataset.tipValue);
  }
  // 汇总数值直接用快照里的 latency/loss —— 和 CPU、内存同一条链路,展开
  // 即有,不等这次 ping 请求回来(格子仍需要 1 小时的原始记录)。
  const meta = nodeMeta.get(uuid) || {};
  refs.latNow.textContent = meta.latency == null ? '—' : Math.round(meta.latency) + 'ms';
  refs.lossNow.textContent = meta.loss == null ? '—' : (meta.loss * 100).toFixed(1) + '%';
}

function setChip(chip, text, tone, title) {
  if (!chip) return;
  chip.className = 'ntag num' + (tone ? ' ' + tone : '');
  chip.textContent = text;
  chip.title = title;
}

// 速率徽章的三栏。结构只搭一次,之后每次轮询只改文字 —— 每秒重建一遍
// DOM 没必要,徽章模式换了 buildNodes 本来就会重建整行。
function setRateChip(chip, arrow, bps, online, label) {
  if (!chip) return;
  if (chip.childElementCount !== 3) {
    chip.textContent = '';
    for (const cls of ['sym', 'val', 'unit']) {
      const part = document.createElement('span');
      part.className = cls;
      chip.appendChild(part);
    }
  }
  chip.className = 'ntag num rate';
  const [sym, val, unit] = chip.children;
  sym.textContent = arrow;
  const parts = online ? rateParts(bps) : null;
  val.textContent = parts ? parts.value : '—';
  unit.textContent = parts ? parts.unit : '';
  chip.title = parts ? label + ' ' + fmtRate(bps) : '离线';
}

// 名称后的指标徽章。阈值与展开卡片里的格子图一致,同一个数在两处看到的
// 颜色才是一个意思。
function paintBadges(chips, meta, uuid) {
  if (!chips || !chips.length) return;
  if (nodeBadge === 'ping') {
    const lat = meta.latency, loss = meta.loss;
    setChip(chips[0], lat == null ? '—' : Math.round(lat) + 'ms',
      lat == null ? '' : lat < 100 ? 'g' : lat < 200 ? 'a' : 'r',
      lat == null ? '延迟：无数据' : '延迟 ' + Math.round(lat) + ' ms');
    setChip(chips[1], loss == null ? '—' : (loss * 100).toFixed(1) + '%',
      loss == null ? '' : loss === 0 ? 'g' : loss <= 0.05 ? 'a' : 'r',
      loss == null ? '丢包：无数据' : '丢包 ' + (loss * 100).toFixed(1) + '%');
  } else if (nodeBadge === 'net') {
    const s = nodeSeries.get(uuid);
    const last = meta.online ? s && s[s.length - 1] : null;
    setRateChip(chips[0], '↑', last && last.up, !!last, '上行');
    setRateChip(chips[1], '↓', last && last.down, !!last, '下行');
  } else {
    const days = remainingDays(meta.expiredAt);
    setChip(chips[0], fmtRemaining(meta.expiredAt),
      days === null ? '' : days <= 0 ? 'r' : days <= 7 ? 'a' : '',
      meta.expiredAt ? '到期 ' + meta.expiredAt : '未设置到期时间');
  }
}

// 增量补丁：不重建 DOM，只更新在线点与数值
function patchNodes() {
  const container = document.getElementById('nodes');
  const cardEls = container.querySelectorAll('.card');
  const uuids = visibleUuids();
  cardEls.forEach((card, idx) => {
    try {
      const uuid = uuids[idx];
      const meta = nodeMeta.get(uuid);
      if (!meta) return;
      const r = card._refs;
      if (!r) return;
      r.row.querySelector('.dot').className = 'dot' + (meta.online ? '' : ' off');
      if (nodeBadge !== 'tags') paintBadges(r.badges, meta, uuid);
      r.upt.textContent = meta.online ? fmtUptime(meta.uptime) : '—';
      r.expire.textContent = fmtRemaining(meta.expiredAt);
      r.totalUp.textContent = fmtBytes(meta.totalUp);
      r.totalDown.textContent = fmtBytes(meta.totalDown);
      if (meta.online) {
        const s = nodeSeries.get(uuid);
        const last = s && s[s.length - 1];
        r.rates.textContent = last ? '↑ ' + fmtRate(last.up) + ' · ↓ ' + fmtRate(last.down) : '—';
        r.cpuPv.textContent = meta.cpu.toFixed(0) + '%';
        r.memPv.textContent = meta.memPct.toFixed(0) + '%';
        r.cpuBar.querySelector('i').style.width = Math.min(100, Math.max(0, meta.cpu)) + '%';
        r.cpuBar.className = 'bar cpu' + (meta.cpu >= cpuWarnPct ? ' hot' : '');
        r.memBar.querySelector('i').style.width = Math.min(100, Math.max(0, meta.memPct)) + '%';
        r.memBar.className = 'bar mem' + (meta.memPct >= memWarnPct ? ' hot' : '');
        r.diskPv.textContent = meta.diskTotal > 0 ? meta.diskPct.toFixed(0) + '%' : '—';
        r.diskPv.title = meta.diskTotal > 0 ? fmtBytes(meta.diskUsed) + ' / ' + fmtBytes(meta.diskTotal) : '';
        r.diskBar.querySelector('i').style.width = Math.min(100, Math.max(0, meta.diskPct)) + '%';
        r.diskBar.className = 'bar disk' + (meta.diskPct >= 90 ? ' hot' : '');
        const usedTraffic = trafficUsed(meta);
        const trafficPct = meta.trafficLimit > 0 ? usedTraffic / meta.trafficLimit * 100 : 0;
        r.trafficPv.textContent = meta.trafficLimit > 0 ? trafficPct.toFixed(0) + '%' : '—';
        r.trafficPv.title = meta.trafficLimit > 0 ? fmtBytes(usedTraffic) + ' / ' + fmtBytes(meta.trafficLimit) : '未设置流量额度';
        r.trafficLbl.title = '计费方式：' + (meta.trafficLimitType || 'max');
        r.trafficBar.querySelector('i').style.width = Math.min(100, Math.max(0, trafficPct)) + '%';
        r.trafficBar.className = 'bar traffic' + (trafficPct >= 90 ? ' hot' : '');
      } else {
        r.rates.textContent = '离线';
        r.cpuPv.textContent = '—';
        r.memPv.textContent = '—';
        r.cpuBar.querySelector('i').style.width = '0%';
        r.cpuBar.className = 'bar cpu';
        r.memBar.querySelector('i').style.width = '0%';
        r.memBar.className = 'bar mem';
        r.diskPv.textContent = '—';
        r.diskBar.querySelector('i').style.width = '0%';
        r.diskBar.className = 'bar disk';
        r.trafficPv.textContent = '—';
        r.trafficBar.querySelector('i').style.width = '0%';
        r.trafficBar.className = 'bar traffic';
      }
      if (card.classList.contains('open')) renderPingGrid(uuid, r);
    } catch (e) { console.error('patch card failed', e); }
  });
}

// 列表可滚动后,刚展开的卡片可能在视野外,把它带进来。
function revealExpandedCard() {
  const container = document.getElementById('nodes');
  const card = container.querySelector('.card.open');
  if (card) card.scrollIntoView({ block: 'nearest' });
}

function drawMinis() {
  const container = document.getElementById('nodes');
  const uuids = visibleUuids();
  container.querySelectorAll('.card.open').forEach((card) => {
    const idx = [...container.querySelectorAll('.card')].indexOf(card);
    const uuid = uuids[idx];
    if (uuid) drawMini(card._refs.canvas, nodeSeries.get(uuid) || []);
  });
}

// 弹窗高度随内容自适应,上限是托盘图标那一侧屏幕剩下的空间;超出后节点区
// 自行滚动(无滚动条),窗口不再变高。
// 高度上限与窗口重定位交给 Rust:它知道弹窗贴着托盘图标的哪一边,
// 会朝远离该边的方向生长,展开节点时不会顶到屏幕外。
//
// 同一时刻只允许一轮在跑。快照、历史、focus 刷新都会触发调整,各自捕获一个
// 高度再各跑一轮重试的话,应用刚启动、节点还没到的那次打开会让窗口在"空列表"
// 和"有节点"两个高度之间来回跳 —— 这就是第一次打开时下半截闪的原因。
let fitting = false;
let fitAgain = false;

async function fitHeight() {
  if (fitting) {
    // 正在跑的那一轮拿的是过期高度了,让它收尾时按最新内容重量一次
    fitAgain = true;
    return;
  }
  fitting = true;
  try {
    do {
      fitAgain = false;
      await fitHeightOnce();
    } while (fitAgain);
  } finally {
    fitting = false;
  }
}

async function fitHeightOnce() {
  const panel = document.getElementById('panel');
  panel.style.height = 'auto';
  const needed = panel.offsetHeight;
  // The native resize can settle at a slightly different viewport height on
  // macOS. Stretch to that real viewport instead of leaving a white strip
  // below the rounded panel.
  document.body.style.height = '100%';
  panel.style.height = '100%';
  if (window.__chartNeeded === needed) return;
  window.__chartNeeded = needed;
  // 最多下发两次。窗口刚创建时 set_size 可能被初始化盖掉,所以保留一次补发;
  // 但补发之间只是等 viewport 跟上,不反复下发同一个高度 —— 窗口已经是那个
  // 尺寸了,再设一次只会让它多跳一下。
  for (let issue = 0; issue < 2; issue++) {
    const applied = await invoke('resize_chart', { height: needed }).catch(() => null);
    if (typeof applied !== 'number') return;
    for (let wait = 0; wait < 6; wait++) {
      await new Promise((r) => setTimeout(r, 60));
      if (window.innerHeight === Math.round(applied)) return;
      // 内容又变了,别再为这个过期高度较劲,交给下一轮
      if (fitAgain) return;
    }
  }
}

function scheduleDraw() {
  const now = Date.now();
  if (now - lastDraw < 1000) return;
  lastDraw = now;
  syncNodes();
  drawAggregate();
  drawMinis();
}

function ingestSnap(snap) {
  backendOk = !!snap.backend_ok;
  onlineCount = snap.nodes.filter((n) => n.online).length;
  totalCount = snap.nodes.length;
  if (snap.backend_ok) {
    const t = snap.last_update_ms || Date.now();
    nodeMeta = new Map();
    totalUp = 0; totalDown = 0;
    for (const n of snap.nodes) {
      nodeMeta.set(n.uuid, {
        name: n.name || n.uuid,
        online: !!n.online,
        cpu: n.cpu_usage,
        memPct: n.ram_total > 0 ? (n.ram_used / n.ram_total) * 100 : 0,
        diskUsed: n.disk_used || 0,
        diskTotal: n.disk_total || 0,
        diskPct: n.disk_total > 0 ? (n.disk_used / n.disk_total) * 100 : 0,
        totalUp: n.total_up || 0,
        totalDown: n.total_down || 0,
        trafficLimit: n.traffic_limit || 0,
        trafficLimitType: n.traffic_limit_type || 'max',
        expiredAt: n.expired_at || null,
        uptime: n.uptime_secs,
        region: n.region || '',
        os: n.os || "",
        group: n.group || '',
        tags: n.tags || [],
        latency: n.latency ?? null,
        loss: n.loss ?? null,
      });
      totalUp += n.total_up; totalDown += n.total_down;
      let s = nodeSeries.get(n.uuid);
      if (!s) { s = []; nodeSeries.set(n.uuid, s); }
      if (!s.length || t > s[s.length - 1].t) {
        s.push({ t, up: n.net_up, down: n.net_down, online: !!n.online });
        const cutoff = t - FRONT_BUFFER_MS;
        while (s.length && s[0].t < cutoff) s.shift();
      }
    }
    for (const uuid of [...nodeSeries.keys()]) {
      if (!nodeMeta.has(uuid)) nodeSeries.delete(uuid);
    }
    points.push({
      t,
      up: snap.nodes.reduce((a, n) => a + n.net_up, 0),
      down: snap.nodes.reduce((a, n) => a + n.net_down, 0),
    });
    while (points.length && points[0].t < t - FRONT_BUFFER_MS) points.shift();
  }
  renderHeader();
  scheduleDraw();
}

async function refresh() {
  // 每次重新聚焦(即每次打开)都重算高度:屏幕可能换了一块,可用空间也就变了。
  window.__chartNeeded = null;
  // 顺序按 CPU、网络速率这类实时值排时会一直变,平时靠缓存稳住;每次打开
  // 弹窗重新算一次,这样看到的排序是当下的。
  orderCache.key = null;
  try {
    const s = await invoke('get_settings');
    if (s.chart_range_secs) rangeSecs = s.chart_range_secs;
    applyTheme(s.theme || 'system');
    cpuWarnPct = s.cpu_warn_pct || 80;
    memWarnPct = s.mem_warn_pct || 85;
    hiddenNodes = new Set(s.hidden_nodes || []);
    nodeBadge = BADGE_SLOTS[s.node_badge] ? s.node_badge : 'tags';
    // 展开的节点被隐藏后就没有对应的卡片了,顺手收起
    if (expandedUuid && hiddenNodes.has(expandedUuid)) expandedUuid = null;
  } catch (e) { /* keep current values */ }
  // Synchronize from the Rust process's in-memory snapshot. This is local IPC,
  // not a new backend request, and preserves the existing DOM when node IDs
  // have not changed.
  try {
    const snap = await invoke('get_snapshot');
    ingestSnap(snap);
  } catch (e) { /* keep the last live snapshot */ }
  try {
    const payload = await invoke('get_net_history', { rangeSecs: 21600 });
    points = payload.aggregate || [];
    nodeSeries = new Map(Object.entries(payload.nodes || {}));
  } catch (e) { /* keep the cached history */ }
  renderHeader();
  lastDraw = 0;
  syncNodes();
  drawAggregate();
  drawMinis();
}

// 固定显示：失焦不自动收起，再次打开也保持拖动后的位置
const pinBtn = document.getElementById('btn-pin');
let pinned = false;
function renderPin() {
  pinBtn.classList.toggle('active', pinned);
  pinBtn.title = pinned ? '取消置顶' : '置顶显示（失焦不关闭）';
  pinBtn.setAttribute('aria-label', pinBtn.title);
  pinBtn.setAttribute('aria-pressed', String(pinned));
}
pinBtn.addEventListener('click', async () => {
  pinBtn.disabled = true;
  try {
    await invoke('set_chart_pinned', { pinned: !pinned });
    pinned = !pinned;
    renderPin();
  } finally {
    pinBtn.disabled = false;
  }
});

// 按住头部拖动移动窗口
document.getElementById('header').addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  if (e.target.closest('#btn-pin')) return;
  win.startDragging().catch(() => {});
});

async function restorePin() {
  try {
    pinned = await invoke('get_chart_pinned');
    renderPin();
  } catch (e) { /* default unpinned */ }
}

// 拉取节点的网络质量记录(延迟/丢包,1 小时),经 Rust 代理避免跨域
async function fetchPing(uuid) {
  try {
    const recs = await invoke('get_ping_records', { uuid, hours: 1 });
    pingSeries.set(uuid, (recs || []).filter((p) => isFinite(p.t)));
    lastDraw = 0;
    scheduleDraw();
  } catch (e) { /* 网络失败保持现有内容 */ }
}

// 走 hide_chart 而不是 win.hide():Rust 那边要同步收掉托盘图标的高亮
document.getElementById('btn-panel').addEventListener('click', async () => {
  await invoke('open_panel_cmd').catch(() => {});
  invoke('hide_chart').catch(() => win.hide());
});
document.getElementById('btn-settings').addEventListener('click', async () => {
  await invoke('open_settings_cmd').catch(() => {});
  invoke('hide_chart').catch(() => win.hide());
});
const searchInput = document.getElementById('node-search');
searchInput.addEventListener('input', () => {
  nodeQuery = searchInput.value.trim().toLowerCase();
  syncNodes();
});

document.getElementById('btn-tags').addEventListener('click', (e) => {
  e.stopPropagation();
  setPop(openPop === 'tags' ? null : 'tags');
});

document.getElementById('btn-sort').addEventListener('click', (e) => {
  e.stopPropagation();
  setPop(openPop === 'sort' ? null : 'sort');
});

document.getElementById('btn-group').addEventListener('click', (e) => {
  e.stopPropagation();
  setPop(openPop === 'group' ? null : 'group');
});

document.addEventListener('click', (e) => {
  if (!openPop) return;
  if (e.target instanceof Element
    && e.target.closest('#tagpop, #btn-tags, #sortpop, #btn-sort, #grouppop, #btn-group')) return;
  setPop(null);
});

window.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  // Esc 分三级:先收浮层,再清筛选,最后才收起整个面板 —— 免得正在
  // 输入时一按就没了。
  if (openPop) {
    setPop(null);
    return;
  }
  if (searchInput.value || activeTags.size || activeGroup !== null) {
    searchInput.value = '';
    nodeQuery = '';
    activeTags.clear();
    tagbarKey = null;
    activeGroup = null;
    groupbarKey = null;
    syncNodes();
    return;
  }
  invoke('hide_chart').catch(() => win.hide());
});
let chartWidth = window.innerWidth;
window.addEventListener('resize', () => {
  if (chartWidth !== window.innerWidth) {
    chartWidth = window.innerWidth;
    window.__chartNeeded = null;
    fitHeight();
  }
  lastDraw = 0;
  scheduleDraw();
  // 面板刚被 fitHeight 改过高度,浮层的可用空间也跟着变了
  if (openPop) placePop(openPop);
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (themeMode === 'system') applyTheme('system');
});

(async () => {
  await listen('monitor://update', (e) => ingestSnap(e.payload));
  await listen('theme://changed', (e) => applyTheme(e.payload));
  // 弹窗在两次打开之间只是隐藏,保存设置后需要主动重取(隐藏节点等)
  await listen('settings://changed', () => { refresh(); });
  // 换了后端 = 换了一整套节点。缓存(节点、曲线、ping、筛选)全部作废,
  // 否则旧后端的节点会一直挂在列表和曲线里。
  await listen('monitor://reset', () => {
    nodeMeta = new Map();
    nodeSeries = new Map();
    pingSeries.clear();
    points = [];
    totalUp = 0; totalDown = 0;
    onlineCount = null;
    totalCount = 0;
    expandedUuid = null;
    activeTags.clear();
    nodeQuery = '';
    searchInput.value = '';
    setPop(null);
    tagbarKey = null;
    nodesKey = null;
    refresh();
  });
  // Refresh from process memory on focus; the page and node DOM stay alive.
  win.listen('tauri://focus', () => {
    window.__chartNeeded = null;
    fitHeight();
    refresh();
  });
  await restorePin();
  renderSortPop();
  refresh();
  setInterval(() => {
    if (expandedUuid) fetchPing(expandedUuid);
  }, 30000);
})();
</script>
