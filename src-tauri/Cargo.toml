[package]
name = "hotaru"
version = "0.2.0"
description = "Komari and 极简探针 (monitor-probe) monitoring tray app for macOS and Windows"
license = "GPL-3.0-only"
authors = ["Gongsc"]
edition = "2021"

[lib]
name = "hotaru_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
tiny-skia = "0.11"
parking_lot = "0.12"
log = "0.4"
url = "2"

# Reaching the NSStatusItem's button, which Tauri does not expose: to mark it
# selected while the popover is open, and to give it the two-line rate text the
# plain string title cannot express. Already in the tree by way of Tauri
# itself, so this costs no extra build.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "NSApplication",
  "NSAttributedString",
  "NSButton",
  "NSCell",
  "NSControl",
  "NSEvent",
  "NSFont",
  "NSFontDescriptor",
  "NSParagraphStyle",
  "NSResponder",
  "NSStatusBarButton",
  "NSText",
  "NSView",
  "NSWindow",
  "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSAttributedString",
  "NSDictionary",
  "NSRange",
  "NSString",
  "NSValue",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
